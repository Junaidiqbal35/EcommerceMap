<div class="layer-item {% if layer.layer_id in preferred_layer_ids %}layer-preferred{% endif %}" 
     data-layer-id="{{ layer.layer_id }}"
     id="layer-item-{{ layer.layer_id }}">
    
    <input type="checkbox" 
           id="layer-{{ layer.layer_id }}"
           class="layer-checkbox"
           onchange="toggleLayer({{ layer.layer_id }}, this)">
    
    <div class="layer-info">
        <label for="layer-{{ layer.layer_id }}" class="layer-name">
            {{ layer.name }}
            {% if layer.layer_id in preferred_layer_ids %}
            <span class="preferred-badge" title="Preferred layer">⭐</span>
            {% endif %}
        </label>
        <div class="layer-meta">
            <span class="layer-type type-{{ layer.type }}">
                {% if layer.type == 'point' %}📍{% elif layer.type == 'polyline' %}〰️{% else %}⬡{% endif %}
                {{ layer.type }}
            </span>
        </div>
    </div>
    
    <div class="layer-actions">
        {% if layer.geometry %}
        <button type="button" 
                class="btn-zoom" 
                onclick="zoomToLayer({{ layer.layer_id }}, {{ layer.geometry.centroid.y }}, {{ layer.geometry.centroid.x }})"
                title="Zoom to layer">
            🔍
        </button>
        {% endif %}
        
        {% if filter_type == 'preferred' %}
            {# In preferred view: clicking removes from list #}
            <button type="button"
                    class="btn-favorite is-favorite"
                    hx-post="{% url 'toggle_layer_favorite' layer.layer_id %}"
                    hx-target="#layer-item-{{ layer.layer_id }}"
                    hx-swap="outerHTML swap:0.3s"
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                    hx-confirm="Remove from preferred layers?"
                    title="Remove from favorites">
                ★
            </button>
        {% else %}
            {# In other views: toggle favorite status #}
            <button type="button"
                    class="btn-favorite {% if layer.layer_id in preferred_layer_ids %}is-favorite{% endif %}"
                    hx-post="{% url 'toggle_layer_favorite' layer.layer_id %}"
                    hx-target="#layer-item-{{ layer.layer_id }}"
                    hx-swap="outerHTML"
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                    title="{% if layer.layer_id in preferred_layer_ids %}Remove from favorites{% else %}Add to favorites{% endif %}">
                {% if layer.layer_id in preferred_layer_ids %}★{% else %}☆{% endif %}
            </button>
        {% endif %}
    </div>
</div>
